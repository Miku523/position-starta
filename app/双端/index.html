  // 重置只该清演示数据：保留身份与明暗主题，否则演示讲到一半会被踢回落地页
  state.role=role; state.theme=theme;
  syncPostedJobs();
  commit();
  ui.view=role==="hr"?"pool":"jobs";
  Object.assign(ui.jobs,{q:"",type:"全部",only:false});
  ui.pool={q:"",status:"全部",job:"all"};
  ui.posts={q:""};
  closeModal(); closeDrawer();
  renderApp();
  toast("演示数据已重置 · 身份保留在"+(role==="hr"?"招聘方":"求职者")+"端");
}

/* ================= 事件 ================= */
document.addEventListener("click",function(e){
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.getAttribute("data-act");
  if(act==="role"){ switchRole(el.getAttribute("data-role")); return; }
  if(act==="nav"){ ui.view=el.getAttribute("data-view"); renderApp(); return; }
  if(act==="theme"){ state.theme=state.theme==="dark"?"light":"dark"; commit(); renderApp(); return; }
  if(act==="help"){ openHelp(); return; }
  if(act==="reset"){ openReset(); return; }
  if(act==="close-modal"){ closeModal(); return; }
  if(act==="close-drawer"){ closeDrawer(); return; }
  if(act==="reset-confirm"){ doReset(); return; }
  if(act==="apply"){ applyJob(el.getAttribute("data-job")); return; }
  if(act==="gov"){ const j=jobById(el.getAttribute("data-job")); if(j) openGov(j); return; }
  if(act==="gov-remind"){
    const j=jobById(el.getAttribute("data-job"));
    if(!j) return;
    const on=toggleGovRemind(j.id);
    renderApp();
    toast(on?"已设报名提醒 · 本机标记，不会真的发通知":"已取消报名提醒");
    const keep=modalFocus;
    openGov(j);
    modalFocus=keep;
    const rb=$('#modal [data-act="gov-remind"]');
    if(rb) rb.focus();
    return;
  }
  if(act==="cand-view"){
    const id=el.getAttribute("data-app"), mode=el.getAttribute("data-mode");
    const a=state.apps.find(function(x){ return x.id===id; });
    if(!a) return;
    candViewMode=(mode==="cand")?"cand":"hr";
    const back=drawerFocus;
    openDrawer(candDrawer(a));
    drawerFocus=back;
    const nb=$('#drawer [data-act="cand-view"][data-mode="'+candViewMode+'"]');
    if(nb) nb.focus();
    return;
  }
  if(act==="job"){ openJobDrawer(el.getAttribute("data-job")); return; }
  if(act==="cand"){ openCandDrawer(el.getAttribute("data-app")); return; }
  if(act==="advance"){ advanceApp(el.getAttribute("data-app")); return; }
  if(act==="withdraw"){ openWithdraw(el.getAttribute("data-app")); return; }
  if(act==="withdraw-confirm"){ confirmWithdraw(el.getAttribute("data-app")); return; }
  if(act==="interview"){ openInterview(el.getAttribute("data-app"), el.getAttribute("data-no")); return; }
  if(act==="interview-save"){ saveInterview(el.getAttribute("data-app"), el.getAttribute("data-no")); return; }
  if(act==="close-by-round"){ closeByRound(el.getAttribute("data-app"), el.getAttribute("data-no")); return; }
  if(act==="ics"){ exportIcs(el.getAttribute("data-app"), el.getAttribute("data-no")); return; }
  if(act==="panel"){ openPanel(el.getAttribute("data-app"), parseInt(el.getAttribute("data-no"),10)||1); return; }
  if(act==="panel-save"){ savePanel(el.getAttribute("data-app"), el.getAttribute("data-no")); return; }
  if(act==="review"){ openReview(el.getAttribute("data-app")); return; }
  if(act==="review-save"){ saveReview(el.getAttribute("data-app")); return; }
  if(act==="reject"){ openReject(el.getAttribute("data-app")); return; }
  if(act==="reject-confirm"){ confirmReject(el.getAttribute("data-app")); return; }
  if(act==="save-profile"){ saveProfile(); return; }
  if(act==="post-open"){ openPostModal(); return; }
  if(act==="req-edit"){ openReqModal(el.getAttribute("data-job")); return; }
  if(act==="sug-take"){ takeSuggestion(el.getAttribute("data-job")); return; }
  if(act==="req-save"){ saveReq(el.getAttribute("data-job")); return; }
  if(act==="req-restore"){ restoreReq(el.getAttribute("data-job")); return; }
  if(act==="claim"){ openClaimModal(el.getAttribute("data-job")); return; }
  if(act==="claim-submit"){ confirmClaim(el.getAttribute("data-job")); return; }
  if(act==="post-submit"){ confirmPost(); return; }
  if(act==="type"){ ui.jobs.type=el.getAttribute("data-type"); renderApp(); return; }
  if(act==="toggle-only"){ ui.jobs.only=!ui.jobs.only; renderApp(); return; }
  if(act==="quick"){
    const q=el.getAttribute("data-q");
    ui.jobs.only=(q==="only");
    renderApp();
    return;
  }
  if(act==="pool-status"){ ui.pool.status=el.getAttribute("data-status"); renderApp(); return; }
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){ ui.jobs.q=e.target.value; renderJobList(); }
  else if(e.target.id==="poolQ"){ ui.pool.q=e.target.value; renderPoolList(); }
  else if(e.target.id==="postQ"){ ui.posts.q=e.target.value; renderPostRows(); }
});
document.addEventListener("change",function(e){
  if(e.target.id==="poolJob"){ ui.pool.job=e.target.value; renderPoolList(); }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Tab"){
    if(!$("#modal").hidden){ trapTab(e,$("#modal")); return; }
    if($("#drawer").classList.contains("open")){ trapTab(e,$("#drawer")); return; }
  }
  if(e.key==="Escape"){
    if(!$("#modal").hidden) closeModal();
    else if($("#drawer").classList.contains("open")) closeDrawer();
    return;
  }
});
$("#scrim").addEventListener("click",closeDrawer);
$("#modal").addEventListener("click",function(e){ if(e.target===$("#modal")) closeModal(); });
/* ================= 实时数据层（组件在页面顶部的 live.js）================= */
const SAVE_AT_KEY=KEY+":at";
function readSaveAt(){
  try{ const v=Number(localStorage.getItem(SAVE_AT_KEY)||0); return isFinite(v)&&v>0?v:null; }catch(e){ return null; }
}
// 岗位截止时间：公告里怎么写的就怎么解析（"2026-10-26 17:00" / "10-26" / "长期"）
function jobDeadline(job){
  if(!job||!job.d||job.d==="长期") return NaN;
  return window.Live?Live.toDate(String(job.d)):NaN;
}
// renderApp 会重刷顶栏/状态栏，胶囊与“写入于”要重新绑到新节点上
function livePillRebind(){
  if(!window.Live) return;
  const pill=document.querySelector("#livePill");
  if(pill){
    Live.pill(pill);
    const clockEl=pill.querySelector(".live-clock");
    if(clockEl) Live.clock(clockEl);
  }
  const ao=document.querySelector("#liveAsOf");
  if(ao) Live.ago(ao, readSaveAt, {prefix:"状态写入于 ", emptyText:"尚未写入本机"});
  if(!window.__liveCounted && pill){
    window.__liveCounted=true;
    Live.autoNum(document.querySelector("#app")||document.body);
  }
}
window.__liveRebind=livePillRebind;
function initLive(){
  if(!window.Live||window.__liveStarted) return;
  window.__liveStarted=true;
  Live.init({channel:"starta-live",pill:"#livePill",tabLabel:"双端演示",localAsOf:true});
  livePillRebind();
}
window.addEventListener("storage",function(e){
  if(e.key!==KEY && e.key!==KEY+":at") return;
  const before=state.apps.length;
  state=loadState(); syncPostedJobs(); renderApp();
  const delta=state.apps.length-before;
  const pill=document.querySelector("#livePill");
  if(pill){ pill.classList.add("live-flash"); setTimeout(function(){pill.classList.remove("live-flash");},1000); }
  if(pill && window.Live) Live.pill(pill);
  toast("已同步另一个标签页的改动"+(delta?" · 投递 "+(delta>0?"+":"")+delta:"")+
        " · "+new Date().toLocaleTimeString("zh-CN",{hour12:false}));
});

function applyJob(id){
  const job=jobById(id);
  if(!job) return;
  const ev=evalJob(job,state.profile);
  if(!ev.ok){ toast("资格不符："+ev.fails.join("、")); return; }
  if(isClosed(job)){ toast("这个岗位已截止，不能再投"); return; }
  if(isGov(job)){ openGov(job); return; }
  if(state.apps.some(a=>a.mine && a.jobId===id)){ toast("这个岗位你已经投过了"); return; }
  const me={
    id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    jobId:id,
    candidate:{name:state.profile.name,edu:state.profile.edu,major:state.profile.major,exp:state.profile.exp,city:state.profile.city,skills:state.profile.skills.slice()},
    mine:true,status:"已投递",reason:null,score:ev.score,
    events:[{status:"已投递",at:nowISO()}],
    updatedAt:nowISO()
  };
  state.apps.push(me);
  commit();
  closeDrawer();
  renderApp();
  toast("已投递 · 切到「招聘方」就能看到这张单");
}
function openCandDrawer(id){
  const a=state.apps.find(x=>x.id===id);
  if(!a) return;
  candViewMode="hr";
  openDrawer(candDrawer(a));
}
function switchRole(role){
  state.role=role;
  ui.view=role==="candidate"?"jobs":"pool";
  ui.pool={q:"",status:"全部",job:"all"};
  Object.assign(ui.jobs,{q:"",type:"全部",only:false});
  ui.posts={q:""};
  commit();
  closeDrawer(); closeModal();
  renderApp();
  toast(role==="candidate"?"已切换到求职者端 · 林一":"已切换到招聘方端 · 陈晓");
}
function upcomingInterviews(days, onlyMine){
  const t=new Date(); t.setHours(0,0,0,0);
  const now=new Date();
  const lim=new Date(t); lim.setDate(lim.getDate()+(days||7));
  const out=[];
  state.apps.forEach(function(a){
    if(a.status!=="面试") return;
    if(onlyMine && !a.mine) return;
    (a.interviews||[]).forEach(function(iv){
      if(!iv.date) return;
      const d=new Date(iv.date+"T"+(iv.time||"00:00")+":00");
      if(isNaN(d.getTime())) return;
      if(d>=now && d<=lim) out.push({app:a,iv:iv,at:d});
    });
  });
  return out.sort(function(x,y){ return x.at-y.at; });
}
function upbarHtml(scope){
  const list=upcomingInterviews(7, scope!=="hr");
  if(!list.length) return "";
  const next=list[0];
  const j=jobById(next.app.jobId);
  const when=next.iv.date+" "+next.iv.time;
  const d0=new Date(); d0.setHours(0,0,0,0);
  const gap=Math.round((new Date(next.iv.date+"T00:00:00")-d0)/86400000);
  const tag=gap===0?'<span class="badge bad">今天</span>':gap===1?'<span class="badge warn">明天</span>':'';
  if(scope==="hr"){
    return '<div class="upbar"><b>未来 7 天 '+list.length+' 场面试</b>'+tag+'<span>最近：'+esc(when)+' · '+esc(next.app.candidate.name)+'（'+esc(j?j.u+" · "+j.r:"")+'）</span></div>';
  }
  return '<div class="upbar"><b>你最近一场面试</b>'+tag+'<span>'+esc(when)+' · '+esc(j?j.u+" · "+j.r:"")+' · '+esc(next.iv.mode)+(next.iv.place?' · '+esc(next.iv.place):'')+'</span></div>';
}
function timelineHtml(a){
  return '<div class="tl">'+a.events.map(e=>
    '<div class="tli'+(e.status==="已淘汰"?" bad":"")+'"><span class="tdot"></span><div>'+
      '<b>'+STATUS_LABEL[e.status]+'</b><span>'+fmt(e.at)+'</span>'+
      (e.status==="已淘汰" && a.reason?'<p>理由：'+esc(a.reason)+'</p>':'')+
    '</div></div>'
  ).join("")+'</div>';
}

/* ================= 启动 ================= */
applyTheme();
syncPostedJobs();
renderApp();
initLive();
})();
</script>
