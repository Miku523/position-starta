<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>现场截图 · 岗位要求的地层</title>
<style>
:root{--bg:#0B0D10;--panel:#12151A;--ink:#EDECE7;--ink2:#C6C8CE;--dim:#8A8F98;--line:#252A31;--accent:#E4572E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header,main,footer{max-width:880px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.08em;color:var(--dim)}
header a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
header a:hover{color:var(--accent);border-color:var(--accent)}
h1{font-size:26px;margin:40px 0 8px;font-family:Georgia,"Songti SC",serif;font-weight:600}
p.lede{color:var(--dim);font-size:13px;margin:0}
ul.list{list-style:none;padding:0;margin:26px 0 0;border-top:1px solid var(--line)}
ul.list li{border-bottom:1px solid var(--line)}
ul.list li a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:13px 4px;color:var(--ink);text-decoration:none}
ul.list li a:hover{color:var(--accent)}
ul.list .nm{font-family:ui-monospace,Consolas,monospace;font-size:13px}
ul.list .note{color:var(--dim);font-size:12px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
figure img{display:block;width:100%;height:170px;object-fit:cover;background:#000}
figcaption{padding:8px 10px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{padding:44px 24px 60px;color:var(--dim);font-size:11px;letter-spacing:.06em}
code{background:#1A1E24;padding:1px 5px;border-radius:4px;font-size:12px}
@media(max-width:640px){.grid{grid-template-columns:1fr 1fr}figure img{height:130px}}
</style>
</head>
<body>
<header>
  <a href="../">← 回到报告</a>
  <span>PREVIEWS · 现场</span>
